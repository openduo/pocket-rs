[workspace]
members = ["crates/pocket-core", "crates/pocket-ffi", "crates/pocket-client"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/openduo/pocket-rs"
authors = ["OpenDuo contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
thiserror = "2"
pocket-core = { path = "crates/pocket-core", version = "0.1.1" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
